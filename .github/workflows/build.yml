name: Build Model

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    environment: Staging
    steps:      
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download and extract dataset
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p ./data/raw

          curl -fL \
            "https://archive.ics.uci.edu/static/public/20/census+income.zip" \
            -o /tmp/census-income.zip

          unzip -o /tmp/census-income.zip -d ./data/raw

          rm /tmp/census-income.zip

          echo "Dataset extracted to ./data/raw"
          find ./data -maxdepth 2 -type f      

      - name: Train and save model
        run: |
          python src/main.py
        env:
          AZURE_CLIENT_ID: ${{secrets.AZURE_CLIENT_ID}}
          AZURE_TENANT_ID: ${{secrets.AZURE_TENANT_ID}}
          AZURE_CLIENT_SECRET: ${{secrets.AZURE_CLIENT_SECRET}}
          MLFLOW_URL: ${{vars.MLFLOW_URL}}
          EXPERIMENT_NAME: ${{vars.EXPERIMENT_NAME}}
      - name: Publicar artefactos
        uses: actions/upload-artifact@v4
        with:
          name: model.pkl
          path: ./models/model.pkl
          retention-days: 30